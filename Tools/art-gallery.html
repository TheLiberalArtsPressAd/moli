<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Crossgate Survivors · 美術預覽</title>
<style>
  body { margin: 0; background: #10141c; color: #cfd8e6; font: 13px/1.5 "Microsoft JhengHei", sans-serif; }
  h1 { font-size: 16px; margin: 16px 20px 4px; font-weight: 600; }
  p { margin: 0 20px 12px; color: #8e9bb0; }
  canvas { display: block; margin: 0 0 8px 20px; border-radius: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 20px 16px; }
  .cell { width: 108px; text-align: center; color: #7f8da3; }
  .cell canvas { margin: 0 auto; }
</style>
</head>
<body>
<h1>美術預覽 / art preview</h1>
<p>所有圖形都是程式繪製的原創素材，不含原始遊戲檔案。</p>
<canvas id="tiles" width="960" height="420"></canvas>
<div class="row" id="actors"></div>
<div class="row" id="props"></div>

<script src="../art.js"></script>
<script>
(function () {
  var tc = document.getElementById("tiles").getContext("2d");
  var terrain = ART.buildTerrain({ Name: "芙蕾雅島", MapWidth: 60, MapHeight: 60 }, "island");
  tc.fillStyle = "#0d1118";
  tc.fillRect(0, 0, 960, 420);
  ART.drawGround(tc, terrain, { x: 960, y: 960 }, 960, 420, 1.3);

  var names = { goblin: "哥布林", goblin_red: "紅帽哥布林", treant: "樹精", imp: "使魔",
    bat: "小蝙蝠", bat_big: "大蝙蝠", bee: "蜜蜂", rat: "老鼠", zombie: "喪屍",
    golem: "小石魔像", spider: "蜘蛛", slime: "史萊姆", slime_blue: "藍史萊姆",
    hero_sword: "劍士", hero_bow: "弓箭手" };

  var box = document.getElementById("actors");
  ART.actorKeys.forEach(function (key) {
    var d = document.createElement("div");
    d.className = "cell";
    var c = document.createElement("canvas");
    c.width = 96; c.height = 112;
    var g = c.getContext("2d");
    g.fillStyle = "rgba(255,255,255,0.03)";
    g.fillRect(0, 0, 96, 112);
    ART.drawActor(g, key, 48, 100, { scale: 0.85 });
    var label = document.createElement("div");
    label.textContent = names[key] || key;
    d.appendChild(c);
    d.appendChild(label);
    box.appendChild(d);
  });

  var pbox = document.getElementById("props");
  ["tree", "bush", "rock", "flower", "mushroom", "house", "well"].forEach(function (type) {
    var d = document.createElement("div");
    d.className = "cell";
    var c = document.createElement("canvas");
    c.width = 140; c.height = 130;
    var g = c.getContext("2d");
    g.fillStyle = "rgba(255,255,255,0.03)";
    g.fillRect(0, 0, 140, 130);
    ART.drawProp(g, { type: type, variant: 0, scale: 1 }, 70, 124);
    var label = document.createElement("div");
    label.textContent = type;
    d.appendChild(c);
    d.appendChild(label);
    pbox.appendChild(d);
  });
})();
</script>
</body>
</html>
