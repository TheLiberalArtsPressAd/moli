<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>景色預覽</title>
<style>
  body { margin: 0; background: #0d1017; color: #e8eefc; font-family: "Microsoft JhengHei", sans-serif; }
  h1 { font-size: 15px; padding: 12px 16px; margin: 0; background: #10141c; }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 12px; }
  .cell { background: #111722; border: 1px solid #26314a; border-radius: 8px; overflow: hidden; }
  .cell canvas { display: block; width: 100%; height: 128px; }
  .cell p { margin: 0; padding: 6px 8px; font-size: 12px; color: #b9c7de; }
</style>
</head>
<body>
<h1>關卡景色預覽（原版地圖 + 各關卡色調 / 環境效果）</h1>
<div id="grid"></div>
<script src="../art.js"></script>
<script>
  fetch("../config/game_config.json").then(function (r) { return r.json(); }).then(function (cfg) {
    return ART.load().then(function () {
      var grid = document.getElementById("grid");
      cfg.Levels.forEach(function (lv) {
        var scene = ART.buildLevel(lv);
        var cell = document.createElement("div");
        cell.className = "cell";
        var cv = document.createElement("canvas");
        cv.width = 320; cv.height = 128;
        cell.appendChild(cv);
        var cap = document.createElement("p");
        cap.textContent = lv.Name + " · " + scene.biome;
        cell.appendChild(cap);
        grid.appendChild(cell);

        var g = cv.getContext("2d");
        if (scene.bg) {
          var s = Math.max(320 / scene.bg.width, 128 / scene.bg.height) * 1.6;
          g.drawImage(scene.bg, (320 - scene.bg.width * s) / 2, (128 - scene.bg.height * s) / 2,
            scene.bg.width * s, scene.bg.height * s);
        }
        // 幾棵樹當代表
        for (var i = 0; i < Math.min(4, scene.props.length); i++) {
          var pr = scene.props[i];
          ART.drawProp(g, pr, 40 + i * 80, 118);
        }
        if (scene.biomeDef && scene.biomeDef.fog) {
          g.fillStyle = scene.biomeDef.fog;
          g.fillRect(0, 0, 320, 128);
        }
        if (scene.biomeDef) {
          ART.drawAmbient(g, scene, { x: scene.w / 2, y: scene.h / 2 }, 320, 128, 1.5);
        }
      });
    });
  });
</script>
</body>
</html>
