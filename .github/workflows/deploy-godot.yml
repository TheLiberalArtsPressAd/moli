name: Build and Deploy Godot Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-inprocress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/4.3.stable/* ~/.local/share/gotdot/export_templates/4.3.stable/ 2>/dev/null || cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true

      - name: Build HTML5
        run: |
          mkdir -p docs
          cd godot
          godot --headless --export-release "Web" ../docs/index.html
        env:
        GODOT_VERSION: 4.3

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
